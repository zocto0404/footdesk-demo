<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8edc8"><title>这里有人坐了 · 同事清理小游戏</title><link rel="stylesheet" href="style.css?v=4"></head><body>
<main id="stage" aria-label="这里有人坐了，桌下互动游戏"><canvas id="game" width="1200" height="676" tabindex="0" aria-label="A S D 控制左脚，J K L 控制右脚，也可按住画面里的拖鞋踩踏"></canvas>
<div id="hud" hidden><div class="scoreboard" aria-label="当日累计成果"><small>今日工位同事清理记录</small><div><b id="score">0</b><span>分</span></div><p>动脚 <strong id="total">0</strong> 次 <i>·</i> 请离 <strong id="hits">0</strong> 位</p><p class="footcounts">左 <span id="leftCount">0</span> <i>/</i> 右 <span id="rightCount">0</span></p></div><button id="offwork" class="offwork">下班了 <span>↗</span></button><div class="resident-note"><i></i><span id="residents">6</span> 位临时同事</div></div>
<div id="toast" role="status" aria-live="polite" aria-atomic="true" class="toast"><svg class="toast-bubble" aria-hidden="true" viewBox="0 0 460 110" preserveAspectRatio="none"><defs><filter id="bubble-rough" x="-8%" y="-15%" width="116%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".13" numOctaves="3" seed="8" result="grain"/><feDisplacementMap in="SourceGraphic" in2="grain" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><path class="bubble-body" d="M38 13 C75 7 115 11 153 10 C211 7 249 13 292 10 C339 7 375 9 412 14 C438 16 450 30 447 48 C450 65 438 78 414 81 C365 86 317 81 268 84 C252 93 238 105 221 105 L230 84 C171 86 122 82 73 84 C37 85 12 77 12 57 C6 39 11 21 38 13Z"/><path class="bubble-grain" d="M38 13 C75 7 115 11 153 10 C211 7 249 13 292 10 C339 7 375 9 412 14 C438 16 450 30 447 48 C450 65 438 78 414 81 C365 86 317 81 268 84 C252 93 238 105 221 105 L230 84 C171 86 122 82 73 84 C37 85 12 77 12 57 C6 39 11 21 38 13Z"/></svg><span class="toast-copy"></span></div><div id="storageWarning" role="status" hidden>本地保存暂不可用，刷新后记录可能丢失。</div>
<section id="intro" class="screen"><div class="intro-art"><img src="assets/walk.png" alt="白身尖耳办公室小怪物"></div><div class="intro-card"><span class="eyebrow">一款随时加入、随时放下的桌下小游戏</span><h1>这里有人坐了<span>。</span></h1><p class="lead">工位是我的。脚边也是。</p><p class="description">你忙你的，同事来脚边开会。<br>偶尔动动脚，把脚边的小会议弹散。</p><div class="keyguide"><div><span>左脚</span><div><kbd>A<small>左倾</small></kbd><kbd class="key-down">S<small>踩下</small></kbd><kbd>D<small>右倾</small></kbd></div></div><div><span>右脚</span><div><kbd>J<small>左倾</small></kbd><kbd class="key-down">K<small>踩下</small></kbd><kbd>L<small>右倾</small></kbd></div></div></div><p class="mouseguide">也可按住画面里的拖鞋踩下，左右拖动调整位置；松开抬脚。</p><div class="intro-options"><div class="targets" role="group" aria-label="守护目标"><button data-target="space" aria-pressed="true" class="selected">守护脚边</button><button data-target="cheese" aria-pressed="false">一块奶酪</button><button data-target="flower" aria-pressed="false">向日葵</button></div><label><input id="sound" type="checkbox"> 开启音效</label></div><button id="start" class="primary" disabled>同事正在赶来…</button><p class="intro-fine" id="loadStatus">正在准备场景与动画</p></div></section>
<section id="settlement" class="screen" hidden><div class="receipt"><span class="eyebrow" id="reportDate"></span><h2>下班了，<br>脚边也收工。</h2><p class="report-lead" id="reportLead"></p><div class="report-stats"><div><b id="reportTotal">0</b><span>次有效踩踏</span></div><div><b id="reportHits">0</b><span>位同事被请离</span></div></div><div class="report-lines" id="reportLines"></div><div class="report-total"><span>今日总分</span><b id="reportScore">0</b></div><p class="report-fine">地板会变乱，你今天动过的脚都算数。<br>记录保留在此浏览器，继续游玩也不会清零。</p><div class="report-actions"><button id="resume" class="primary">再坐一会儿</button><button id="exportReport" class="secondary">下载记录 ↓</button></div></div></section>
</main><script src="game.js?v=4"></script></body></html>
